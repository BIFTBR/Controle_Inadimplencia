<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inadimplência (Detalhado) - Fast Tennis</title>
<style>
  :root{
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #ffffff;
    --surface-2: #fcfcfb;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --border:    rgba(11,11,11,0.10);
    --border-2:  rgba(11,11,11,0.06);

    --c-opropria:  #2a78d6;
    --c-doforyou:  #eb6834;
    --c-franq:     #1baf7a;
    --c-plug:      #eda100;
    --c-playfast:  #e87ba4;

    --s-good:     #0ca30c;
    --s-warning:  #fab219;
    --s-serious:  #ec835a;
    --s-critical: #d03b3b;

    --up-good:    #006300;
    --down-bad:   #d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1c1c1a;
      --surface-2: #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #8f8d86;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.12);
      --border-2:  rgba(255,255,255,0.07);

      --c-opropria:  #3987e5;
      --c-doforyou:  #d95926;
      --c-franq:     #199e70;
      --c-plug:      #c98500;
      --c-playfast:  #d55181;

      --s-good:     #0ca30c;
      --s-warning:  #fab219;
      --s-serious:  #ec835a;
      --s-critical: #d03b3b;

      --up-good:    #0ca30c;
      --down-bad:   #e66767;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1c1c1a;
    --surface-2: #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #8f8d86;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,0.12);
    --border-2:  rgba(255,255,255,0.07);

    --c-opropria:  #3987e5;
    --c-doforyou:  #d95926;
    --c-franq:     #199e70;
    --c-plug:      #c98500;
    --c-playfast:  #d55181;

    --s-good:     #0ca30c;
    --s-warning:  #fab219;
    --s-serious:  #ec835a;
    --s-critical: #d03b3b;

    --up-good:    #0ca30c;
    --down-bad:   #e66767;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline: max(16px, calc((100vw - 1360px)/2));
    padding-block: 32px 32px;
  }
  h1,h2,h3{font-family:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;}
  .num{font-variant-numeric: tabular-nums;}
  button{font-family:inherit;}
  button:focus-visible{outline:2px solid var(--c-franq); outline-offset:2px;}

  /* ---------- header: faixa azul (branded, fixa — não segue tema claro/escuro) ---------- */
  .topbar{
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
    background:linear-gradient(180deg, #1c2f5c 0%, #101a38 100%);
    border-radius:16px;
    padding:26px 130px 24px;
    min-height:118px;
    margin-bottom:22px;
  }
  .topbar h1{
    font-size:21px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    margin:0; color:#ffffff; text-align:center; text-wrap:balance; position:relative;
  }
  .topbar-accent{width:110px; height:3px; border-radius:2px; background:#4f8ef7; margin:3px 0 5px; position:relative;}
  .topbar-logo-box{
    position:absolute; right:20px; bottom:18px;
    display:flex; align-items:center;
  }
  .topbar-logo{height:40px; width:auto; display:block;}

  .topbar-nav-link{
    position:absolute; left:20px; top:18px;
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; color:#dbe4fb; text-decoration:none;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
    padding:6px 12px 6px 10px; border-radius:99px; transition:background .15s;
  }
  .topbar-nav-link:hover{background:rgba(255,255,255,0.16);}
  .topbar-nav-link svg{width:12px; height:12px; flex:none;}
  .topbar-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:#bcd0ff; background:rgba(79,142,247,0.18); border:1px solid rgba(79,142,247,0.4);
    padding:4px 11px; border-radius:99px; margin-top:2px;
  }

  .update-control{position:relative; display:flex; flex-direction:column; align-items:center; gap:5px;}
  .update-meta{font-size:11.5px; color:#ffffff; font-weight:700; margin:0; text-align:center; min-height:14px;}
  .update-meta.ok{color:#5fdc8a;}
  .update-meta.err{color:#ff9393;}

  .filters-row{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:16px;}
  .filters-left{display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; gap:20px; flex:1 1 480px; min-width:0;}
  .filter-group{display:flex; align-items:center; gap:8px;}
  .month-control{display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none;}
  .month-notes{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .month-filter{display:flex; align-items:center; flex-wrap:wrap; gap:8px; justify-content:flex-end;}
  .month-note{font-size:12px; color:var(--muted); margin:0; display:flex; align-items:center; gap:6px;}
  .clear-filters-btn{
    background:none; border:none; padding:2px 0; margin:0;
    font-size:11.5px; font-weight:600; color:var(--muted); cursor:pointer;
    text-decoration:underline; text-underline-offset:2px;
  }
  .clear-filters-btn:hover{color:var(--ink);}

  /* ---------- month dropdown (multi-select) ---------- */
  .month-dropdown{position:relative;}
  .month-dd-btn{
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:9px; cursor:pointer;
    min-width:150px; justify-content:space-between;
  }
  .month-dd-btn:hover{border-color:var(--ink-2);}
  .month-dd-chevron{width:10px; height:10px; flex:none; color:var(--muted); transition:transform .15s;}
  .month-dropdown.open .month-dd-chevron{transform:rotate(180deg);}
  .month-dd-panel{
    display:none;
    position:absolute; top:calc(100% + 6px); right:0; z-index:20;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
    padding:8px; min-width:220px; max-height:320px; overflow-y:auto;
  }
  .month-dropdown.open .month-dd-panel{display:block;}
  .month-dd-actions{display:flex; gap:6px; padding:2px 4px 8px; border-bottom:1px solid var(--border-2); margin-bottom:6px;}
  .month-dd-actions button{
    font-size:11px; font-weight:700; color:var(--ink-2); background:var(--surface-2);
    border:1px solid var(--border-2); padding:4px 9px; border-radius:6px; cursor:pointer;
  }
  .month-dd-actions button:hover{background:var(--border-2);}
  .month-dd-year{
    font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.04em;
    padding:6px 6px 4px; text-transform:uppercase;
  }
  .month-dd-row{
    display:flex; align-items:center; gap:8px; padding:6px 6px; border-radius:7px;
    cursor:pointer; font-size:13px; color:var(--ink);
  }
  .month-dd-row:hover{background:var(--surface-2);}
  .month-dd-row input{accent-color:var(--ink); width:14px; height:14px; flex:none; cursor:pointer;}
  .month-dd-row.is-ongoing .month-dd-row-label::after{
    content:'em andamento'; font-size:10px; font-weight:600; color:var(--muted);
    margin-left:6px; text-transform:none; letter-spacing:0;
  }
  .month-dd-row-dot{width:8px; height:8px; border-radius:50%; flex:none;}

  /* ---------- filtros: empresa / status / pendência (listas de seleção) ---------- */
  .cf-label{font-size:12.5px; font-weight:700; color:var(--muted); margin-right:2px;}
  .cf-dot{width:8px; height:8px; border-radius:50%; flex:none;}

  /* ---------- toolbar: busca + agrupar por ---------- */
  .toolbar-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    margin-bottom:12px;
  }
  .toolbar-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .search-input-wrap{position:relative; display:flex; align-items:center;}
  .search-input-wrap svg{position:absolute; left:11px; width:14px; height:14px; color:var(--muted); pointer-events:none;}
  .search-input{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-size:12.5px; font-family:inherit; padding:8px 12px 8px 32px; border-radius:9px;
    min-width:220px;
  }
  .search-input:focus-visible{outline:2px solid var(--c-franq); outline-offset:1px;}
  .groupby-select{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-size:12.5px; font-weight:600; font-family:inherit; padding:8px 10px; border-radius:9px; cursor:pointer;
  }
  .toolbar-summary{font-size:12px; color:var(--muted); font-weight:600;}
  .toolbar-summary b{color:var(--ink);}

  /* ---------- painel da tabela ---------- */
  .table-panel{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:6px; margin-bottom:14px;
  }
  .data-table-wrap{
    overflow:auto; max-height:74vh; border-radius:9px;
  }
  table.data-table{
    width:100%; min-width:780px; border-collapse:separate; border-spacing:0;
    font-size:12.5px;
  }
  table.data-table thead th{
    position:sticky; top:0; z-index:3;
    background:var(--surface-2); color:var(--ink-2);
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    text-align:left; padding:10px 12px; border-bottom:1px solid var(--border);
    white-space:nowrap; cursor:default;
  }
  table.data-table thead th.sortable{cursor:pointer; user-select:none;}
  table.data-table thead th.sortable:hover{color:var(--ink);}
  table.data-table thead th .sort-arrow{margin-left:4px; opacity:.55; font-size:9px;}
  table.data-table thead th.num, table.data-table td.num{text-align:right; font-variant-numeric:tabular-nums;}
  table.data-table tbody td{
    padding:8px 12px; border-bottom:1px solid var(--border-2); white-space:nowrap;
    color:var(--ink-2);
  }
  table.data-table tbody td.col-nome{color:var(--ink); font-weight:600; max-width:220px; overflow:hidden; text-overflow:ellipsis;}
  table.data-table tbody td.col-obs{max-width:220px; overflow:hidden; text-overflow:ellipsis;}
  table.data-table tbody tr.data-row:hover td{background:var(--surface-2);}
  table.data-table tbody tr.data-row:nth-child(even) td{background:rgba(128,128,128,0.035);}
  table.data-table tbody tr.data-row:nth-child(even):hover td{background:var(--surface-2);}

  .row-empresa{display:inline-flex; align-items:center; gap:7px;}
  .row-empresa .cf-dot{width:8px; height:8px; border-radius:50%; flex:none;}

  .status-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:99px; white-space:nowrap;
  }
  .status-pill.st-emaberto{background:rgba(208,59,59,0.12); color:var(--s-critical);}
  .status-pill.st-pendente{background:rgba(250,178,25,0.16); color:#9c6c05;}
  .status-pill.st-acordo{background:rgba(11,11,11,0.07); color:var(--ink-2);}
  .status-pill.st-pago{background:rgba(12,163,12,0.13); color:var(--up-good);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .status-pill.st-pendente{color:#f5c563;}
  }
  :root[data-theme="dark"] .status-pill.st-pendente{color:#f5c563;}

  td.col-atraso{font-weight:700;}
  td.col-atraso.is-late{color:var(--s-critical);}

  /* ---------- linhas de agrupamento (tabela dinâmica) ---------- */
  tr.group-row td{
    background:var(--surface-2); border-bottom:1px solid var(--border);
    padding:0; font-weight:700; color:var(--ink); font-size:14.5px;
    cursor:pointer;
  }
  tr.group-row:hover td{background:var(--border-2);}
  tr.group-row .group-row-inner{
    position:sticky; left:0;
    display:inline-flex; align-items:center; max-width:100vw;
    padding:11px 14px;
  }
  tr.group-row .group-chevron{
    display:inline-block; width:10px; height:10px; margin-right:9px; flex:none;
    border-right:2.5px solid var(--ink-2); border-bottom:2.5px solid var(--ink-2);
    transform:rotate(45deg); transition:transform .15s; vertical-align:1px;
  }
  tr.group-row.is-collapsed .group-chevron{transform:rotate(-45deg);}
  .group-label{display:inline-flex; align-items:center;}
  .group-meta{font-weight:600; color:var(--muted); font-size:13px; margin-left:10px;}
  .group-meta b{color:var(--ink-2); font-weight:700;}
  tr.group-total-row td{
    background:var(--surface); font-weight:800; color:var(--ink);
    border-bottom:2px solid var(--border); font-size:12.5px;
  }
  tr.empty-row td{padding:26px 12px; text-align:center; color:var(--muted); font-size:13px;}

  /* ---------- consolidação por nome (quando o mesmo nome+empresa repete) ---------- */
  tr.name-group-row td{
    background:var(--page); border-bottom:1px solid var(--border-2);
    padding:0; font-weight:600; color:var(--ink); font-size:12.5px;
    cursor:pointer;
  }
  tr.name-group-row:hover td{background:var(--surface-2);}
  tr.name-group-row .name-group-inner{
    position:sticky; left:0;
    display:inline-flex; align-items:center; flex-wrap:wrap; gap:8px; max-width:100vw;
    padding:7px 12px 7px 30px;
  }
  tr.name-group-row .name-group-chevron{
    display:inline-block; width:8px; height:8px; margin-right:2px; flex:none;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
    transform:rotate(-45deg); transition:transform .15s; vertical-align:1px;
  }
  tr.name-group-row.is-expanded .name-group-chevron{transform:rotate(45deg);}
  .name-group-name{font-weight:700; color:var(--ink);}
  .name-group-emp{font-weight:600; color:var(--ink-2); font-size:11.5px;}
  .name-group-meta{font-weight:600; color:var(--muted); font-size:11.5px;}
  .name-group-meta b{color:var(--ink-2); font-weight:700;}
  tr.data-row.is-nested td{background:rgba(128,128,128,0.025);}
  tr.data-row.is-nested td.col-nome{padding-left:34px; color:var(--muted); font-weight:500;}
  tr.data-row.is-nested:hover td{background:var(--surface-2);}

  @media (max-width:860px){
    .filters-row{flex-direction:column; flex-wrap:nowrap; justify-content:flex-start;}
    .filters-left{flex:none; width:100%; flex-direction:column; align-items:flex-start; gap:10px;}
    .filter-group{width:100%; justify-content:space-between;}
    .filter-group .month-dropdown{flex:1 1 auto;}
    .filter-group .month-dd-btn{width:100%;}
    .month-control{align-items:flex-start; width:100%;}
    .month-filter{justify-content:flex-start;}
    .month-notes{align-items:flex-start;}
    .toolbar-row{flex-direction:column; align-items:flex-start;}
  }
  @media (max-width:640px){
    .topbar{padding:22px 20px 20px;}
    .topbar-logo-box{position:static; margin-top:14px;}
    .topbar-nav-link{position:static; margin-bottom:10px;}
  }
</style>

:""},{"pv":"09/2026","pp":"","nome":"Fast Tennis Calafate","pend":"Mensalidade","emp":"Play Fast","venc":"24/09/2026","dpgto":"","atraso":"4","meio":"Cartão de Crédito","vpend":"R$ 970,92","vpago":"R$ 0,00","status":"Em aberto","solic":"","obs":""},{"pv":"09/2026","pp":"","nome":"Eduardo Angelo Beilfuss Moreira","pend":"Mensalidade","emp":"Play Fast","venc":"27/09/2026","dpgto":"","atraso":"1","meio":"Cartão de Crédito","vpend":"R$ 219,90","vpago":"R$ 0,00","status":"Em aberto","solic":"","obs":""},{"pv":"09/2026","pp":"","nome":"Fast Tennis Lago dos Patos","pend":"Mensalidade","emp":"Play Fast","venc":"26/09/2026","dpgto":"","atraso":"2","meio":"Cartão de Crédito","vpend":"R$ 1.189,00","vpago":"R$ 0,00","status":"Em aberto","solic":"","obs":""},{"pv":"09/2026","pp":"","nome":"Bryte da Silva lopes","pend":"Mensalidade","emp":"Play Fast","venc":"25/09/2026","dpgto":"","atraso":"3","meio":"Cartão de Crédito","vpend":"R$ 219,90","vpago":"R$ 0,00","status":"Em aberto","solic":"","obs":""},{"pv":"09/2026","pp":"","nome":"Fast Tennis Cidade Jardim","pend":"Mensalidade","emp":"Play Fast","venc":"25/09/2026","dpgto":"","atraso":"3","meio":"Cartão de Crédito","vpend":"R$ 1.189,00","vpago":"R$ 0,00","status":"Em aberto","solic":"","obs":""},{"pv":"09/2026","pp":"","nome":"Fast Tennis Parque das Nacoes","pend":"Mensalidade","emp":"Play Fast","venc":"25/09/2026","dpgto":"","atraso":"3","meio":"Cartão de Crédito","vpend":"R$ 1.189,00","vpago":"R$ 0,00","status":"Em aberto","solic":"","obs":""},{"pv":"09/2026","pp":"","nome":"Fast Tennis Eusébio","pend":"Mensalidade","emp":"Play Fast","venc":"25/09/2026","dpgto":"","atraso":"3","meio":"Pix","vpend":"R$ 1.189,00","vpago":"R$ 0,00","status":"Em aberto","solic":"","obs":""}]</script>

<script>
(function(){
  var COMPANIES = ['Operação Própria','Do For You','Franqueadora','Plug Marketing','Play Fast'];
  var COMPANY_COLOR_VAR = {
    'Operação Própria': '--c-opropria',
    'Do For You': '--c-doforyou',
    'Franqueadora': '--c-franq',
    'Plug Marketing': '--c-plug',
    'Play Fast': '--c-playfast'
  };
  var STATUSES = ['Em aberto', 'Pendente', 'Acordo', 'Pago'];
  var STATUS_CLASS = {'Em aberto':'st-emaberto', 'Pendente':'st-pendente', 'Acordo':'st-acordo', 'Pago':'st-pago'};
  var PENDENCIAS = ['Royalties', 'Mensalidade', 'Consumo Mensal', 'Taxa de Implantação'];

  var MONTH_NAMES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }

  // primeiro mês disponível na base; o último mês é sempre o mês corrente,
  // calculado a partir da data real — o filtro se estende sozinho a cada
  // novo mês, sem precisar editar o código.
  var PERIOD_START_YEAR = 2026, PERIOD_START_MONTH = 1;
  function buildPeriods(){
    var now = new Date();
    var endYear = now.getFullYear(), endMonth = now.getMonth() + 1;
    var periods = [], meta = {};
    var y = PERIOD_START_YEAR, m = PERIOD_START_MONTH;
    while(y < endYear || (y === endYear && m <= endMonth)){
      var key = y + '-' + pad2(m);
      periods.push(key);
      meta[key] = {year: y, month: m, name: MONTH_NAMES_PT[m-1], short: MONTH_NAMES_PT[m-1].slice(0,3) + '/' + String(y).slice(2), col: pad2(m) + '/' + y};
      m++; if(m > 12){ m = 1; y++; }
    }
    return {periods: periods, meta: meta};
  }
  var PERIODS_INFO = buildPeriods();
  var PERIODS = PERIODS_INFO.periods;
  var PERIOD_META = PERIODS_INFO.meta;
  var COL_TO_KEY = {};
  PERIODS.forEach(function(k){ COL_TO_KEY[PERIOD_META[k].col] = k; });

  // número pt-BR da aba Base ("R$ 3.142,74", "-" ou vazio) -> Number
  function parseBRNumber(s){
    if(s === undefined || s === null) return 0;
    var t = String(s).trim();
    if(t === '' || t === '-' || t === 'R$ -') return 0;
    t = t.replace('R$', '').trim();
    var n = parseFloat(t.replace(/\./g,'').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }
  function parseCSVLine(line){
    var out = [], cur = '', inQ = false;
    for(var i=0;i<line.length;i++){
      var ch = line[i];
      if(inQ){
        if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else { inQ = false; } }
        else { cur += ch; }
      } else {
        if(ch === '"'){ inQ = true; }
        else if(ch === ','){ out.push(cur); cur = ''; }
        else { cur += ch; }
      }
    }
    out.push(cur);
    return out;
  }
  function fmtBRL2(v){
    return 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  // "dd/mm/yyyy" -> valor comparável para ordenação
  function dateSortVal(s){
    if(!s) return 0;
    var p = s.split('/');
    if(p.length !== 3) return 0;
    return Number(p[2])*10000 + Number(p[1])*100 + Number(p[0]);
  }

  // ---- dados vivos: começam com o que veio embutido no HTML; assim que a
  // página carrega, uma primeira atualização via fetch() já busca a versão
  // mais recente da aba Base publicada (ver seção "atualização de dados") ----
  var RAW_ROWS = JSON.parse(document.getElementById('dataStore').textContent);
  var ROWS = [];
  function normalizeRows(raw){
    return raw.map(function(r){
      return {
        pv: r.pv, pp: r.pp, nome: r.nome, pend: r.pend, emp: r.emp, venc: r.venc,
        dpgto: r.dpgto, atraso: parseInt(r.atraso, 10) || 0, meio: r.meio,
        vpendRaw: r.vpend, vpagoRaw: r.vpago, vpend: parseBRNumber(r.vpend), vpago: parseBRNumber(r.vpago),
        status: r.status, solic: r.solic, obs: r.obs
      };
    });
  }
  ROWS = normalizeRows(RAW_ROWS);

  // ---- estado dos filtros ----
  var selectedCompanies = new Set(COMPANIES);
  var selectedStatuses = new Set(STATUSES);
  var selectedPendencias = new Set(PENDENCIAS);
  var selectedMonths = new Set(PERIODS); // todos por padrão (sem filtro de período)
  var searchText = '';
  var groupBy = 'empresa';
  var sortField = 'nome', sortDir = 'asc';
  var collapsedGroups = new Set();
  var expandedNameGroups = new Set(); // linhas de mesmo nome+empresa ficam consolidadas por padrão; aqui ficam as que o usuário expandiu

  // ---- filtros como listas de seleção (dropdown com checkboxes) ----
  function initListFilter(opts){
    // opts: dropdown, btn, label, panel, items, getSet, setSet, allLabel, noneLabel, countSuffix, allBtnLabel, getColorVar?
    var checks = [];

    var actions = document.createElement('div');
    actions.className = 'month-dd-actions';
    var btnAll = document.createElement('button');
    btnAll.type = 'button'; btnAll.textContent = opts.allBtnLabel;
    btnAll.addEventListener('click', function(e){
      e.stopPropagation();
      opts.setSet(new Set(opts.items));
      checks.forEach(function(c){ c.input.checked = true; });
      updateLabel();
      render();
    });
    actions.appendChild(btnAll);
    opts.panel.appendChild(actions);

    opts.items.forEach(function(val){
      var row = document.createElement('label');
      row.className = 'month-dd-row';
      var input = document.createElement('input');
      input.type = 'checkbox'; input.checked = true;
      input.addEventListener('change', function(){
        var set = opts.getSet();
        if(input.checked){ set.add(val); } else { set.delete(val); }
        updateLabel();
        render();
      });
      row.appendChild(input);
      if(opts.getColorVar){
        var dot = document.createElement('span');
        dot.className = 'month-dd-row-dot';
        dot.style.background = 'var(' + opts.getColorVar(val) + ')';
        row.appendChild(dot);
      }
      var lbl = document.createElement('span');
      lbl.className = 'month-dd-row-label'; lbl.textContent = val;
      row.appendChild(lbl);
      opts.panel.appendChild(row);
      checks.push({input: input, val: val});
    });

    function updateLabel(){
      var set = opts.getSet();
      if(set.size === opts.items.length){ opts.label.textContent = opts.allLabel; }
      else if(set.size === 0){ opts.label.textContent = opts.noneLabel; }
      else if(set.size === 1){ opts.label.textContent = opts.items.filter(function(v){ return set.has(v); })[0]; }
      else { opts.label.textContent = set.size + ' ' + opts.countSuffix; }
      checks.forEach(function(c){ c.input.checked = set.has(c.val); });
    }

    var ddOpen = false;
    function setDdOpen(open){
      ddOpen = open;
      opts.dropdown.classList.toggle('open', open);
      opts.btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    opts.btn.addEventListener('click', function(e){ e.stopPropagation(); setDdOpen(!ddOpen); });
    document.addEventListener('click', function(e){ if(ddOpen && !opts.dropdown.contains(e.target)){ setDdOpen(false); } });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && ddOpen){ setDdOpen(false); } });

    return { updateLabel: updateLabel };
  }

  var companyFilterCtl = initListFilter({
    dropdown: document.getElementById('companyDropdown'),
    btn: document.getElementById('companyDdBtn'),
    label: document.getElementById('companyDdLabel'),
    panel: document.getElementById('companyDdPanel'),
    items: COMPANIES,
    getColorVar: function(v){ return COMPANY_COLOR_VAR[v]; },
    getSet: function(){ return selectedCompanies; },
    setSet: function(s){ selectedCompanies = s; },
    allLabel: 'Todas', noneLabel: 'Nenhuma', countSuffix: 'selecionadas', allBtnLabel: 'Selecionar todas'
  });

  var statusFilterCtl = initListFilter({
    dropdown: document.getElementById('statusDropdown'),
    btn: document.getElementById('statusDdBtn'),
    label: document.getElementById('statusDdLabel'),
    panel: document.getElementById('statusDdPanel'),
    items: STATUSES,
    getSet: function(){ return selectedStatuses; },
    setSet: function(s){ selectedStatuses = s; },
    allLabel: 'Todos', noneLabel: 'Nenhum', countSuffix: 'selecionados', allBtnLabel: 'Selecionar todos'
  });

  var pendenciaFilterCtl = initListFilter({
    dropdown: document.getElementById('pendenciaDropdown'),
    btn: document.getElementById('pendenciaDdBtn'),
    label: document.getElementById('pendenciaDdLabel'),
    panel: document.getElementById('pendenciaDdPanel'),
    items: PENDENCIAS,
    getSet: function(){ return selectedPendencias; },
    setSet: function(s){ selectedPendencias = s; },
    allLabel: 'Todas', noneLabel: 'Nenhuma', countSuffix: 'selecionadas', allBtnLabel: 'Selecionar todas'
  });

  // ---- período (mês de vencimento): dropdown com checkboxes, todos marcados por padrão ----
  var monthDropdown = document.getElementById('monthDropdown');
  var monthDdBtn = document.getElementById('monthDdBtn');
  var monthDdLabel = document.getElementById('monthDdLabel');
  var monthDdPanel = document.getElementById('monthDdPanel');

  var ddActions = document.createElement('div');
  ddActions.className = 'month-dd-actions';
  var btnAll = document.createElement('button');
  btnAll.type = 'button'; btnAll.textContent = 'Todos os períodos';
  btnAll.addEventListener('click', function(e){ e.stopPropagation(); selectedMonths = new Set(PERIODS); render(); });
  var btnCurrent = document.createElement('button');
  btnCurrent.type = 'button'; btnCurrent.textContent = 'Só o mês atual';
  btnCurrent.addEventListener('click', function(e){ e.stopPropagation(); selectedMonths = new Set([PERIODS[PERIODS.length-1]]); render(); });
  ddActions.appendChild(btnAll); ddActions.appendChild(btnCurrent);
  monthDdPanel.appendChild(ddActions);

  var monthChips = [], yearsSeen = [];
  PERIODS.forEach(function(key){
    var y = PERIOD_META[key].year;
    if(yearsSeen.indexOf(y) === -1){
      yearsSeen.push(y);
      var yearLbl = document.createElement('div');
      yearLbl.className = 'month-dd-year'; yearLbl.textContent = y;
      monthDdPanel.appendChild(yearLbl);
    }
    var row = document.createElement('label');
    row.className = 'month-dd-row';
    if(key === PERIODS[PERIODS.length-1]){ row.classList.add('is-ongoing'); }
    var input = document.createElement('input');
    input.type = 'checkbox'; input.setAttribute('data-month', key);
    input.addEventListener('change', function(){
      if(input.checked){ selectedMonths.add(key); } else { selectedMonths.delete(key); }
      render();
    });
    var lbl = document.createElement('span');
    lbl.className = 'month-dd-row-label'; lbl.textContent = PERIOD_META[key].name;
    row.appendChild(input); row.appendChild(lbl);
    monthDdPanel.appendChild(row);
    monthChips.push({input: input, key: key});
  });

  var ddOpen = false;
  function setDdOpen(open){
    ddOpen = open;
    monthDropdown.classList.toggle('open', open);
    monthDdBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  monthDdBtn.addEventListener('click', function(e){ e.stopPropagation(); setDdOpen(!ddOpen); });
  document.addEventListener('click', function(e){ if(ddOpen && !monthDropdown.contains(e.target)){ setDdOpen(false); } });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && ddOpen){ setDdOpen(false); } });

  // ---- busca por nome ----
  document.getElementById('searchInput').addEventListener('input', function(e){
    searchText = e.target.value.trim().toLowerCase();
    render();
  });

  // ---- agrupar por ----
  document.getElementById('groupBySelect').addEventListener('change', function(e){
    groupBy = e.target.value;
    collapsedGroups = new Set();
    expandedNameGroups = new Set();
    render();
  });

  // ---- ordenação por coluna ----
  var sortableThs = Array.prototype.slice.call(document.querySelectorAll('th.sortable'));
  sortableThs.forEach(function(th){
    th.addEventListener('click', function(){
      var f = th.getAttribute('data-sort');
      if(sortField === f){ sortDir = (sortDir === 'asc' ? 'desc' : 'asc'); }
      else { sortField = f; sortDir = (f === 'nome' || f === 'venc') ? 'asc' : 'desc'; }
      render();
    });
  });
  function updateSortIndicators(){
    sortableThs.forEach(function(th){
      var f = th.getAttribute('data-sort');
      var arrow = th.querySelector('.sort-arrow');
      arrow.textContent = (f === sortField) ? (sortDir === 'asc' ? '▲' : '▼') : '';
    });
  }

  // ---- limpar filtros ----
  document.getElementById('clearFiltersBtn').addEventListener('click', function(){
    selectedCompanies = new Set(COMPANIES); companyFilterCtl.updateLabel();
    selectedStatuses = new Set(STATUSES); statusFilterCtl.updateLabel();
    selectedPendencias = new Set(PENDENCIAS); pendenciaFilterCtl.updateLabel();
    selectedMonths = new Set(PERIODS);
    document.getElementById('searchInput').value = '';
    searchText = '';
    render();
  });

  function sortRows(rows){
    var f = sortField, dir = sortDir;
    var arr = rows.slice();
    arr.sort(function(a, b){
      var av, bv;
      if(f === 'nome'){ av = a.nome.toLowerCase(); bv = b.nome.toLowerCase(); }
      else if(f === 'venc'){ av = dateSortVal(a.venc); bv = dateSortVal(b.venc); }
      else if(f === 'atraso'){ av = a.atraso; bv = b.atraso; }
      else if(f === 'vpend'){ av = a.vpend; bv = b.vpend; }
      else if(f === 'vpago'){ av = a.vpago; bv = b.vpago; }
      else { av = 0; bv = 0; }
      if(av < bv) return dir === 'asc' ? -1 : 1;
      if(av > bv) return dir === 'asc' ? 1 : -1;
      return a.nome.localeCompare(b.nome);
    });
    return arr;
  }

  function groupKeyFor(r){
    if(groupBy === 'empresa') return r.emp;
    if(groupBy === 'nome') return r.nome;
    if(groupBy === 'status') return r.status || '(sem status)';
    if(groupBy === 'periodo') return r.pv;
    return '__flat__';
  }
  function groupLabelHtml(key){
    if(groupBy === 'empresa'){
      var v = COMPANY_COLOR_VAR[key];
      return (v ? '<span class="cf-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(' + v + ');margin-right:8px;"></span>' : '') + key;
    }
    if(groupBy === 'status'){
      return '<span class="status-pill ' + (STATUS_CLASS[key]||'') + '" style="margin-right:8px;">' + key + '</span>';
    }
    if(groupBy === 'periodo'){
      var k = COL_TO_KEY[key];
      return k ? (PERIOD_META[k].name + '/' + PERIOD_META[k].year) : key;
    }
    return key;
  }
  function groupOrder(keys){
    if(groupBy === 'empresa'){ return COMPANIES.filter(function(c){ return keys.indexOf(c) !== -1; }); }
    if(groupBy === 'nome'){ return keys.slice().sort(function(a,b){ return a.localeCompare(b); }); }
    if(groupBy === 'status'){ return STATUSES.filter(function(s){ return keys.indexOf(s) !== -1; }); }
    if(groupBy === 'periodo'){
      return PERIODS.map(function(k){ return PERIOD_META[k].col; }).filter(function(c){ return keys.indexOf(c) !== -1; });
    }
    return keys;
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function rowHtml(r, nested){
    var empDot = COMPANY_COLOR_VAR[r.emp] ? '<span class="cf-dot" style="background:var(' + COMPANY_COLOR_VAR[r.emp] + ')"></span>' : '';
    return '<tr class="data-row' + (nested ? ' is-nested' : '') + '">' +
      '<td class="col-nome" title="' + escapeHtml(r.nome) + '">' + escapeHtml(r.nome) + '</td>' +
      '<td><span class="row-empresa">' + empDot + escapeHtml(r.emp) + '</span></td>' +
      '<td>' + escapeHtml(r.venc) + '</td>' +
      '<td class="num">' + fmtBRL2(r.vpend) + '</td>' +
      '<td class="num">' + fmtBRL2(r.vpago) + '</td>' +
      '<td>' + escapeHtml(r.meio) + '</td>' +
      '<td>' + escapeHtml(r.solic) + '</td>' +
      '<td class="col-obs" title="' + escapeHtml(r.obs) + '">' + escapeHtml(r.obs) + '</td>' +
    '</tr>';
  }

  function groupHeaderHtml(key, groupRows, groupId){
    var count = groupRows.length;
    var sumPend = groupRows.reduce(function(s,r){ return s + r.vpend; }, 0);
    var sumPago = groupRows.reduce(function(s,r){ return s + r.vpago; }, 0);
    var isCollapsed = collapsedGroups.has(groupId);
    return '<tr class="group-row' + (isCollapsed ? ' is-collapsed' : '') + '" data-group="' + escapeHtml(groupId) + '">' +
      '<td colspan="8"><span class="group-row-inner">' +
        '<span class="group-chevron"></span>' +
        '<span class="group-label">' + groupLabelHtml(key) + '</span>' +
        '<span class="group-meta"><b>' + count + '</b> título' + (count === 1 ? '' : 's') +
          ' · pendente: <b>' + fmtBRL2(sumPend) + '</b>' +
          ' · pago: <b>' + fmtBRL2(sumPago) + '</b></span>' +
      '</span></td>' +
    '</tr>';
  }

  // quando o mesmo nome + empresa aparece mais de uma vez dentro de um mesmo
  // bloco (grupo atual, ou tabela inteira se "sem agrupamento"), consolida
  // essas linhas numa única linha resumida (soma pendente/pago), que pode
  // ser expandida pra ver os títulos individuais por baixo
  function buildUnits(rows){
    var byName = {}, order = [];
    rows.forEach(function(r){
      var k = r.nome + '||' + r.emp;
      if(!byName[k]){ byName[k] = []; order.push(k); }
      byName[k].push(r);
    });
    return order.map(function(k){
      var grp = byName[k];
      return grp.length === 1 ? {type:'row', row: grp[0]} : {type:'namegroup', key:k, rows: grp};
    });
  }
  function unitSortValue(u, field){
    if(u.type === 'row'){
      var r = u.row;
      if(field === 'nome') return r.nome.toLowerCase();
      if(field === 'venc') return dateSortVal(r.venc);
      if(field === 'atraso') return r.atraso;
      if(field === 'vpend') return r.vpend;
      if(field === 'vpago') return r.vpago;
      return 0;
    }
    var rows = u.rows;
    if(field === 'nome') return rows[0].nome.toLowerCase();
    if(field === 'venc') return Math.min.apply(null, rows.map(function(r){ return dateSortVal(r.venc); }));
    if(field === 'atraso') return Math.max.apply(null, rows.map(function(r){ return r.atraso; }));
    if(field === 'vpend') return rows.reduce(function(s,r){ return s + r.vpend; }, 0);
    if(field === 'vpago') return rows.reduce(function(s,r){ return s + r.vpago; }, 0);
    return 0;
  }
  // nomes com títulos agrupados (várias cobranças consolidadas numa linha)
  // sempre vão para o final da lista; dentro de cada bloco (linhas soltas /
  // nomes agrupados) a ordenação normal (campo + direção escolhidos) se aplica
  function sortUnits(units){
    var f = sortField, dir = sortDir;
    function cmp(a, b){
      var av = unitSortValue(a, f), bv = unitSortValue(b, f);
      if(av < bv) return dir === 'asc' ? -1 : 1;
      if(av > bv) return dir === 'asc' ? 1 : -1;
      var an = (a.type === 'row' ? a.row.nome : a.rows[0].nome);
      var bn = (b.type === 'row' ? b.row.nome : b.rows[0].nome);
      return an.localeCompare(bn);
    }
    var singles = units.filter(function(u){ return u.type === 'row'; }).sort(cmp);
    var groups = units.filter(function(u){ return u.type === 'namegroup'; }).sort(cmp);
    return singles.concat(groups);
  }
  function nameGroupHtml(u, nameGroupId){
    var rows = u.rows, first = rows[0], count = rows.length;
    var sumPend = rows.reduce(function(s,r){ return s + r.vpend; }, 0);
    var sumPago = rows.reduce(function(s,r){ return s + r.vpago; }, 0);
    var isExpanded = expandedNameGroups.has(nameGroupId);
    var empDot = COMPANY_COLOR_VAR[first.emp] ? '<span class="cf-dot" style="background:var(' + COMPANY_COLOR_VAR[first.emp] + ')"></span>' : '';
    return '<tr class="name-group-row' + (isExpanded ? ' is-expanded' : '') + '" data-namegroup="' + escapeHtml(nameGroupId) + '">' +
      '<td colspan="8"><span class="name-group-inner">' +
        '<span class="name-group-chevron"></span>' +
        '<span class="name-group-name" title="' + escapeHtml(first.nome) + '">' + escapeHtml(first.nome) + '</span>' +
        '<span class="row-empresa name-group-emp">' + empDot + escapeHtml(first.emp) + '</span>' +
        '<span class="name-group-meta"><b>' + count + '</b> títulos' +
          ' · pendente: <b>' + fmtBRL2(sumPend) + '</b>' +
          ' · pago: <b>' + fmtBRL2(sumPago) + '</b></span>' +
      '</span></td>' +
    '</tr>';
  }
  // renderiza uma lista de linhas já filtradas/pertencentes a um mesmo bloco,
  // consolidando nomes repetidos; groupIdPrefix garante ids únicos por bloco
  function renderUnits(rows, groupIdPrefix){
    var units = sortUnits(buildUnits(rows));
    var html = '';
    units.forEach(function(u){
      if(u.type === 'row'){
        html += rowHtml(u.row, false);
      } else {
        var nameGroupId = groupIdPrefix + '::' + u.key;
        html += nameGroupHtml(u, nameGroupId);
        if(expandedNameGroups.has(nameGroupId)){
          html += sortRows(u.rows).map(function(r){ return rowHtml(r, true); }).join('');
        }
      }
    });
    return html;
  }

  function render(){
    // filtro
    var filtered = ROWS.filter(function(r){
      if(!selectedCompanies.has(r.emp)) return false;
      if(!selectedStatuses.has(r.status)) return false;
      if(!selectedPendencias.has(r.pend)) return false;
      var mk = COL_TO_KEY[r.pv];
      if(mk && !selectedMonths.has(mk)) return false;
      if(searchText && r.nome.toLowerCase().indexOf(searchText) === -1) return false;
      return true;
    });

    // rótulo do filtro de período
    if(selectedMonths.size === PERIODS.length){
      monthDdLabel.textContent = 'Todos os períodos';
    } else if(selectedMonths.size === 1){
      var only = PERIODS.filter(function(k){ return selectedMonths.has(k); })[0];
      monthDdLabel.textContent = PERIOD_META[only].short;
    } else {
      monthDdLabel.textContent = selectedMonths.size + ' períodos selecionados';
    }
    monthChips.forEach(function(c){ c.input.checked = selectedMonths.has(c.key); });

    // resumo no toolbar
    var totalCount = filtered.length;
    var totalPend = filtered.reduce(function(s,r){ return s + r.vpend; }, 0);
    var totalPago = filtered.reduce(function(s,r){ return s + r.vpago; }, 0);
    document.getElementById('toolbarSummary').innerHTML =
      '<b>' + totalCount + '</b> título' + (totalCount === 1 ? '' : 's') +
      ' &nbsp;·&nbsp; pendente: <b>' + fmtBRL2(totalPend) + '</b>' +
      ' &nbsp;·&nbsp; pago: <b>' + fmtBRL2(totalPago) + '</b>';

    // agrupamento
    var tbody = document.getElementById('tableBody');
    var html = '';
    if(filtered.length === 0){
      html = '<tr class="empty-row"><td colspan="8">Nenhum título encontrado com os filtros atuais.</td></tr>';
    } else if(groupBy === 'none'){
      html = renderUnits(filtered, 'flat');
    } else {
      var byGroup = {};
      filtered.forEach(function(r){
        var k = groupKeyFor(r);
        (byGroup[k] = byGroup[k] || []).push(r);
      });
      var orderedKeys = groupOrder(Object.keys(byGroup));
      orderedKeys.forEach(function(key){
        var groupRows = sortRows(byGroup[key]);
        var groupId = groupBy + ':' + key;
        html += groupHeaderHtml(key, groupRows, groupId);
        if(!collapsedGroups.has(groupId)){
          // agrupando por nome, o próprio grupo já reúne os títulos da pessoa —
          // não faz sentido consolidar de novo por nome dentro dele
          html += (groupBy === 'nome') ? groupRows.map(function(r){ return rowHtml(r, false); }).join('') : renderUnits(groupRows, groupId);
        }
      });
    }
    tbody.innerHTML = html;

    // clique nos cabeçalhos de grupo pra colapsar/expandir
    Array.prototype.slice.call(tbody.querySelectorAll('tr.group-row')).forEach(function(tr){
      tr.addEventListener('click', function(){
        var gid = tr.getAttribute('data-group');
        if(collapsedGroups.has(gid)){ collapsedGroups.delete(gid); } else { collapsedGroups.add(gid); }
        render();
      });
    });

    // clique nas linhas de nome consolidado pra expandir/recolher os títulos individuais
    Array.prototype.slice.call(tbody.querySelectorAll('tr.name-group-row')).forEach(function(tr){
      tr.addEventListener('click', function(){
        var gid = tr.getAttribute('data-namegroup');
        if(expandedNameGroups.has(gid)){ expandedNameGroups.delete(gid); } else { expandedNameGroups.add(gid); }
        render();
      });
    });

    updateSortIndicators();
  }

  // ---- atualização de dados: busca a aba "Base" publicada como CSV (Google
  // Sheets → Arquivo → Compartilhar → Publicar na web) diretamente pelo
  // navegador de cada pessoa que abrir este arquivo — sem login, sem
  // depender do Claude. Atualiza sozinho a cada 2 min. ----
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTvkpZXLARwz3osC8qU1_SecUKmRyvEThHztlWjIisp1-r-e0cVPMnqXVuc9SXBCX1JabuWyEqFlNTe/pub?gid=2094603707&single=true&output=csv';
  var AUTO_REFRESH_MS = 120000; // 2 minutos
  var updateMeta = document.getElementById('updateMeta');
  function fmtTimeBR(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function setUpdateMeta(text, cls){
    updateMeta.textContent = text;
    updateMeta.className = 'update-meta' + (cls ? ' ' + cls : '');
  }
  setUpdateMeta('última atualização às ' + fmtTimeBR(new Date()));

  var BASE_COLS = ['Período Venc.', 'Período Pgto', 'Nome', 'Pendência', 'Empresa', 'Vencimento', 'Data Pgto', 'Dias atraso', 'Meio de Pgto', 'Valor Pendente', 'Valor Pago', 'Status', 'Solicitações', 'Observação'];

  function parseBaseCSV(text){
    var lines = text.replace(/\r\n/g,'\n').split('\n').filter(function(l){ return l.length > 0; });
    if(!lines.length) return [];
    var header = parseCSVLine(lines[0]).map(function(h){ return h.trim(); });
    var idx = {};
    BASE_COLS.forEach(function(name){ idx[name] = header.indexOf(name); });
    if(idx['Período Venc.'] < 0 || idx['Empresa'] < 0 || idx['Status'] < 0) return [];
    var rows = [];
    for(var i=1;i<lines.length;i++){
      var cells = parseCSVLine(lines[i]);
      var periodoVenc = (cells[idx['Período Venc.']] || '').trim();
      var empresa = (cells[idx['Empresa']] || '').trim();
      if(!periodoVenc || !empresa) continue;
      rows.push({
        pv: periodoVenc,
        pp: (idx['Período Pgto'] >= 0 ? (cells[idx['Período Pgto']] || '') : '').trim(),
        nome: (cells[idx['Nome']] || '').trim(),
        pend: (cells[idx['Pendência']] || '').trim(),
        emp: empresa,
        venc: (cells[idx['Vencimento']] || '').trim(),
        dpgto: (cells[idx['Data Pgto']] || '').trim(),
        atraso: (cells[idx['Dias atraso']] || '').trim(),
        meio: (cells[idx['Meio de Pgto']] || '').trim(),
        vpend: (cells[idx['Valor Pendente']] || '').trim(),
        vpago: (cells[idx['Valor Pago']] || '').trim(),
        status: (cells[idx['Status']] || '').trim(),
        solic: (cells[idx['Solicitações']] || '').trim(),
        obs: (cells[idx['Observação']] || '').trim()
      });
    }
    return rows;
  }

  function looksLikeValidCSV(text){
    return typeof text === 'string' && text.length > 20 && BASE_COLS.every(function(b){ return text.indexOf(b) !== -1; });
  }

  function runUpdate(){
    var url = CSV_URL + '&_ts=' + Date.now();
    fetch(url, {cache:'no-store'})
      .then(function(res){
        if(!res.ok){ throw new Error('http_' + res.status); }
        return res.text();
      })
      .then(function(csvText){
        if(!looksLikeValidCSV(csvText)){ throw new Error('formato_inesperado'); }
        var newRaw = parseBaseCSV(csvText);
        ROWS = normalizeRows(newRaw);
        render();
        setUpdateMeta('última atualização às ' + fmtTimeBR(new Date()), 'ok');
      })
      .catch(function(err){
        // atualização automática que falhou (ex.: sem internet no momento):
        // mantém silenciosamente os últimos dados carregados com sucesso.
      });
  }

  runUpdate();
  setInterval(runUpdate, AUTO_REFRESH_MS);

  render();
})();
</script>
